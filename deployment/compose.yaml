name: tnl-track

x-backend: &backend
  image: tnl-track-backend:local
  build:
    context: ..
    dockerfile: deployment/backend.Dockerfile
  environment:
    NODE_ENV: production
    PORT: 3000
    TRUST_PROXY: '1'
    DB_HOST: db
    DB_PORT: 3306
    DB_NAME: tnl_track
    DB_USER: tnl_app
    DB_PASSWORD: ${DB_PASSWORD:?Run bash manage.sh init first}
    JWT_SECRET: ${JWT_SECRET:?Run bash manage.sh init first}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    PUBLIC_APP_URL: https://${APP_DOMAIN}
    DELIVERY_PHOTO_DIR: /data/delivery-photos
    DELIVERY_PHOTO_RETENTION_DAYS: ${DELIVERY_PHOTO_RETENTION_DAYS:-90}
    WORKER_POLL_MS: ${WORKER_POLL_MS:-5000}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
  volumes:
    - delivery_photos:/data/delivery-photos
  init: true
  logging: &logging
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tnl_track
      MYSQL_USER: tnl_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run bash manage.sh init first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run bash manage.sh init first}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    logging: *logging

  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    stop_grace_period: 2m
    depends_on:
      db:
        condition: service_healthy

  web:
    image: tnl-track-web:local
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  mysql_data:
  delivery_photos:
